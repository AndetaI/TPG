<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gjenerues i Personalizuar i Fjalëkalimeve</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-8">
        
        <h1 class="text-2xl font-bold text-center text-blue-400 mb-2">Gjenerues i Personalizuar i Fjalëkalimeve</h1>
        <form method="POST" action="/" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Emër Mbiemër</label>
                <input type="text" name="emer" value="{{ form_data.emer }}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="p.sh. Ana Hoxha">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Kompania ku punon</label>
                <input type="text" name="kompani" value="{{ form_data.kompani }}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="Dominusoft">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Ditëlindja</label>
                <input type="text" name="dtl" value="{{ form_data.dtl }}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="p.sh. 10/09/1998">
            </div>

            <div class="flex items-center gap-2 pt-2">
                <input type="checkbox" name="simbole" id="simbole" {% if form_data.simbole %}checked{% endif %} class="w-4 h-4 text-blue-600 rounded">
                <label for="simbole" class="text-sm text-slate-300">Përfshi simbole & leetspeak (!, @, #, 3, 0)</label>
            </div>

            <!-- Butonat e veprimit -->
            <div class="flex gap-4 pt-4">
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 text-center">
                     Gjenero Fjalëkalime
                </button>
                <a href="/clear" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold py-2.5 px-4 rounded-lg transition duration-200 text-center flex items-center justify-center">
                     Fshij të gjitha
                </a>
            </div>
        </form>

<!-- Dynamic Results Container -->
        {% if passwords %}
        <div class="mt-8 border-t border-slate-700 pt-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-200">
                    Generated Results (<span class="text-blue-400">{{ passwords|length }}</span>)
                </h2>
                
                <!-- Client-Side Export Button (No POST request triggered) -->
                <button type="button" onclick="downloadWordlist()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium transition-colors text-sm">
                    Export .txt
                </button>
            </div>

            <!-- Scrollable Output Container with ID for JavaScript Access -->
            <div id="passwords-box" class="bg-slate-950 border border-slate-800 rounded-lg p-4 h-64 overflow-y-auto font-mono text-emerald-400 space-y-1 text-sm">
                {% for pw in passwords %}
                    <div>{{ pw }}</div>
                {% endfor %}
            </div>
        </div>
        {% endif %}
    </div>

    <!-- JavaScript Download Engine -->
    <script>
    function downloadWordlist() {
        const container = document.getElementById('passwords-box');
        if (!container) return;

        // Extract every password text entry from the DOM
        const lines = Array.from(container.children).map(div => div.innerText);
        const fileContent = lines.join('\n');

        // Create an in-memory Blob representation of the file
        const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
        const objectUrl = URL.createObjectURL(blob);

        // Dynamically create a temporary anchor link to trigger browser download
        const link = document.createElement('a');
        link.href = objectUrl;
        link.download = 'wordlist.txt';
        
        document.body.appendChild(link);
        link.click();
        
        // Clean up memory
        document.body.removeChild(link);
        URL.revokeObjectURL(objectUrl);
    }
    </script>
</body>
</html>
